name: Keep Render Server Alive

on:
  schedule:
    # Render free tier sleeps after ~15 min idle — ping every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_SERVER_URL: ${{ secrets.RENDER_SERVER_URL }}
        run: |
          URL="${RENDER_SERVER_URL:-https://hr-system-x2uf.onrender.com}"
          echo "Pinging ${URL}/health"
          for attempt in 1 2 3 4; do
            echo "Attempt ${attempt}/4..."
            if curl -fsS --connect-timeout 30 --max-time 120 "${URL}/health"; then
              echo ""
              echo "Ping successful at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              exit 0
            fi
            echo "Attempt ${attempt} failed; waiting 45s for cold start..."
            sleep 45
          done
          echo "All ping attempts failed"
          exit 1
